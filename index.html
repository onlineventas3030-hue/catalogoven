<!doctype html>
<html lang="es" class="h-full bg-stone-50 text-stone-900 antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Katalog Minimal - Catálogo Minimalista con Tasa BCV</title>
    <!-- Tailwind CSS y Fuentes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- React 18 & Babel para ejecutar en el navegador -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-display { font-family: 'Space Grotesk', sans-serif; }
      .font-mono-num { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body class="h-full bg-stone-50 text-stone-900 font-sans selection:bg-stone-900 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      const INITIAL_PRODUCTS = [
        {
          id: 'prod-001',
          code: 'AUD-9010',
          name: 'Auriculares Supraaurales Studio One',
          description: 'Almohadillas de cuero suave y estructura de aluminio anodizado mate. Cancelación de ruido activa híbrida y transductores de 40mm.',
          price_usd: 185.0,
          stock: 14,
          status: 'disponible',
          category: 'Tecnología & Audio',
          images: [
            'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1484704849700-f032a568e944?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-002',
          code: 'SPK-3340',
          name: 'Altavoz Portátil en Cilindro de Hormigón & Lana',
          description: 'Caja acústica con base de hormigón ligero y rejilla de lana nórdica. Conexión True Wireless Stereo y carga USB-C rápida.',
          price_usd: 120.0,
          stock: 6,
          status: 'disponible',
          category: 'Tecnología & Audio',
          images: [
            'https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-003',
          code: 'ACC-1102',
          name: 'Tarjetero Minimal en Cuero Vachetta Natural',
          description: 'Confeccionado a mano con curtido vegetal italiano. Capacidad para 6 tarjetas y compartimento central.',
          price_usd: 48.0,
          stock: 2,
          status: 'bajo_stock',
          category: 'Moda & Accesorios',
          images: [
            'https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-004',
          code: 'LMP-4028',
          name: 'Lámpara de Sobremesa Aura en Travertino',
          description: 'Pieza tallada en bloque de travertino con difusor de vidrio opal soplado artesanalmente.',
          price_usd: 215.0,
          stock: 5,
          status: 'disponible',
          category: 'Hogar & Espacio',
          images: [
            'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-005',
          code: 'COF-7015',
          name: 'Cafetera de Goteo en Vidrio Borosilicato',
          description: 'Set pour-over de borosilicato resistente a choques térmicos con collarín de nogal negro y cordón de cuero crudo.',
          price_usd: 62.0,
          stock: 8,
          status: 'disponible',
          category: 'Cafetería & Rituales',
          images: [
            'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-006',
          code: 'OPT-5104',
          name: 'Gafas de Sol Silueta Octogonal en Titanio',
          description: 'Montura ultraligera moldeada en titanio japonés ionizado mate. Cristales UV400 y peso de 16 gramos.',
          price_usd: 155.0,
          stock: 4,
          status: 'disponible',
          category: 'Moda & Accesorios',
          images: [
            'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80'
          ]
        }
      ];

      function formatBs(amount) {
        return 'Bs. ' + Number(amount).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function formatUsd(amount) {
        return '$' + Number(amount).toFixed(2);
      }

      function App() {
        const [bcvRate, setBcvRate] = useState(68.45);
        const [bcvDate, setBcvDate] = useState(new Date().toLocaleDateString('es-VE'));
        const [products, setProducts] = useState(INITIAL_PRODUCTS);
        const [search, setSearch] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('');
        const [selectedProduct, setSelectedProduct] = useState(null);

        useEffect(() => {
          fetch('https://ve.dolarapi.com/v1/dolares/oficial')
            .then(res => res.json())
            .then(data => {
              const val = parseFloat(data.promedio || data.precio);
              if (val) {
                setBcvRate(val);
                if (data.fechaActualizacion) {
                  setBcvDate(new Date(data.fechaActualizacion).toLocaleDateString('es-VE'));
                }
              }
            })
            .catch(() => console.log('Tasa offline'));
        }, []);

        const categories = useMemo(() => Array.from(new Set(products.map(p => p.category))), [products]);

        const filtered = useMemo(() => {
          return products.filter(p => {
            const matchesSearch = !search || 
              p.name.toLowerCase().includes(search.toLowerCase()) || 
              p.code.toLowerCase().includes(search.toLowerCase());
            const matchesCat = !selectedCategory || p.category === selectedCategory;
            return matchesSearch && matchesCat;
          });
        }, [products, search, selectedCategory]);

        return (
          <div className="min-h-screen flex flex-col bg-stone-50">
            {/* Header */}
            <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-stone-200">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
                <div>
                  <h1 className="font-display font-black text-xl sm:text-2xl text-stone-900 tracking-tighter">
                    KATALOG<span className="text-stone-400">.</span>
                  </h1>
                  <span className="text-[10px] tracking-widest uppercase font-medium text-stone-500">
                    Catálogo Minimalista
                  </span>
                </div>

                <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-stone-100 border border-stone-200 text-xs font-medium">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-stone-500 hidden sm:inline">BCV Oficial:</span>
                  <span className="font-bold text-stone-900 font-mono-num">Bs. {bcvRate.toFixed(2)}</span>
                  <span className="text-[10px] text-stone-400 border-l border-stone-300 pl-1.5 hidden md:inline">{bcvDate}</span>
                </div>
              </div>
            </header>

            {/* Main Content */}
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
              <div className="mb-8 space-y-4">
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Buscar por nombre o código (SKU)..."
                  className="w-full px-4 py-3 bg-white border border-stone-200 rounded-xl text-sm shadow-xs focus:outline-none focus:ring-2 focus:ring-stone-900"
                />

                <div className="flex items-center gap-2 overflow-x-auto pb-2">
                  <button
                    onClick={() => setSelectedCategory('')}
                    className={`px-4 py-2 rounded-xl text-xs font-medium transition-all ${
                      selectedCategory === '' ? 'bg-stone-900 text-white' : 'bg-white text-stone-700 border border-stone-200'
                    }`}
                  >
                    Todos
                  </button>
                  {categories.map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${
                        selectedCategory === cat ? 'bg-stone-900 text-white' : 'bg-white text-stone-700 border border-stone-200'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filtered.map(product => {
                  const calculatedBs = product.price_usd * bcvRate;
                  return (
                    <div
                      key={product.id}
                      onClick={() => setSelectedProduct(product)}
                      className="group bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-xs hover:shadow-lg transition-all cursor-pointer flex flex-col justify-between"
                    >
                      <div className="relative aspect-square overflow-hidden bg-stone-100">
                        <img
                          src={product.images[0]}
                          alt={product.name}
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        />
                        <div className="absolute top-3 left-3 bg-stone-900/80 backdrop-blur-md text-white text-[11px] font-mono px-2 py-1 rounded-md font-bold">
                          CÓD: {product.code}
                        </div>
                        <div className="absolute top-3 right-3 bg-white/90 backdrop-blur-md text-stone-800 text-[11px] px-2 py-1 rounded-md font-medium">
                          {product.category}
                        </div>
                        <div className="absolute bottom-3 left-3 bg-stone-900/80 backdrop-blur-md text-white text-[11px] px-2 py-1 rounded-md flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                          <span>{product.stock} disponibles</span>
                        </div>
                      </div>

                      <div className="p-4 flex-1 flex flex-col justify-between">
                        <div>
                          <h3 className="font-bold text-stone-900 line-clamp-1">{product.name}</h3>
                          <p className="text-xs text-stone-500 mt-1 line-clamp-2">{product.description}</p>
                        </div>
                        <div className="mt-4 pt-3 border-t border-stone-100 flex items-baseline justify-between">
                          <div>
                            <span className="text-[10px] text-stone-400 uppercase font-semibold block">USD</span>
                            <span className="text-lg font-bold text-stone-900 font-mono-num">{formatUsd(product.price_usd)}</span>
                          </div>
                          <div className="text-right">
                            <span className="text-[10px] text-stone-400 font-semibold block">TASA BCV</span>
                            <span className="text-sm font-bold text-stone-700 font-mono-num">{formatBs(calculatedBs)}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>

            {/* Modal */}
            {selectedProduct && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-xs">
                <div className="bg-white rounded-3xl max-w-2xl w-full border border-stone-200 shadow-2xl overflow-hidden relative max-h-[90vh] flex flex-col md:flex-row">
                  <button
                    onClick={() => setSelectedProduct(null)}
                    className="absolute top-4 right-4 z-20 p-2 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 transition-colors"
                  >
                    ✕
                  </button>

                  <div className="w-full md:w-1/2 bg-stone-100 relative aspect-square md:aspect-auto">
                    <img
                      src={selectedProduct.images[0]}
                      alt={selectedProduct.name}
                      className="w-full h-full object-cover"
                    />
                    <div className="absolute top-3 left-3 bg-stone-900/80 backdrop-blur-md text-white text-xs font-mono px-2 py-1 rounded">
                      CÓD: {selectedProduct.code}
                    </div>
                  </div>

                  <div className="w-full md:w-1/2 p-6 flex flex-col justify-between overflow-y-auto">
                    <div>
                      <span className="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-1">
                        {selectedProduct.category}
                      </span>
                      <h3 className="text-xl font-bold text-stone-900">{selectedProduct.name}</h3>

                      <div className="mt-3 p-3 bg-stone-50 border border-stone-200 rounded-xl">
                        <div className="text-2xl font-bold text-stone-900 font-mono-num">
                          {formatUsd(selectedProduct.price_usd)}
                        </div>
                        <div className="text-sm font-semibold text-stone-700 font-mono-num mt-0.5">
                          {formatBs(selectedProduct.price_usd * bcvRate)}
                        </div>
                        <span className="text-[10px] text-stone-500 block mt-1">
                          Tasa oficial BCV: Bs. {bcvRate.toFixed(2)} ({bcvDate})
                        </span>
                      </div>

                      <p className="text-xs text-stone-600 mt-4 leading-relaxed">
                        {selectedProduct.description}
                      </p>
                    </div>

                    <div className="mt-6 pt-4 border-t border-stone-100">
                      <a
                        href={`https://wa.me/?text=${encodeURIComponent(`Hola! Me interesa el producto ${selectedProduct.name} (Código: ${selectedProduct.code}) por valor de ${formatUsd(selectedProduct.price_usd)} (${formatBs(selectedProduct.price_usd * bcvRate)}). ¿Tienen disponibilidad?`)}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl flex items-center justify-center gap-2 transition-colors"
                      >
                        Consultar por WhatsApp
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
