  <body class="h-full bg-stone-50 text-stone-900 font-sans selection:bg-stone-900 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useCallback } = React;

      const DEFAULT_PRODUCTS = [
        {

          stock: 14,

          images: [

            'https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {

          code: 'SPK-3340',

          stock: 6,
          status: 'disponible',

          images: [
            'https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-003',
          code: 'ACC-1102',
          name: 'Tarjetero Minimal en Cuero Vachetta Natural',
          description: 'Confeccionado a mano con curtido vegetal italiano sin tratamientos químicos. Capacidad para 6 tarjetas y compartimento central.',
          price_usd: 48.0,
          stock: 0,
          status: 'agotado',
          category: 'Moda & Accesorios',
          images: [
            'https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=800&q=80'

        {
          id: 'prod-004',
          code: 'LMP-4028',
          name: 'Lámpara de Sobremesa Aura en Travertino',
          description: 'Pieza de iluminación arquitectónica en bloque de travertino con difusor de vidrio opal soplado artesanalmente.',
          price_usd: 215.0,
          stock: 5,
          status: 'disponible',
          category: 'Hogar & Espacio',
          images: [
            'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-005',
          code: 'COF-7015',
          name: 'Cafetera de Goteo en Vidrio Borosilicato',
          description: 'Set pour-over de borosilicato resistente a choques térmicos con collarín de nogal negro y cordón de cuero crudo.',
          price_usd: 62.0,
          stock: 8,
          status: 'disponible',
          category: 'Cafetería & Rituales',
          images: [
            'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-006',
          code: 'OPT-5104',
          name: 'Gafas de Sol Silueta Octogonal en Titanio',
          description: 'Montura ultraligera moldeada en titanio japonés ionizado mate. Cristales minerales UV400 y peso de 16 gramos.',
          price_usd: 155.0,
          stock: 4,
          status: 'disponible',
          category: 'Moda & Accesorios',
          images: [
            'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80'
          ]
        }
      ];

      const DEFAULT_COMPANY = {
        name: 'Katalog Minimal C.A.',
        address: 'Av. Francisco de Miranda, Edif. Centro Cristal, Piso 4, Caracas, Venezuela',
        whatsapp: '+58 412 1234567',
        rif: 'J-50123456-7'
      };

      function formatBs(amount) {
        return 'Bs. ' + Number(amount || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function formatUsd(amount) {
        return '$' + Number(amount || 0).toFixed(2);
      }

      function normalizeImg(url) {
        if (!url || typeof url !== 'string') return '';
        const trimmed = url.trim();
        const driveMatch1 = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (driveMatch1 && driveMatch1[1]) {
          return `https://drive.google.com/thumbnail?id=${driveMatch1[1]}&sz=w1000`;
        }
        const driveMatch2 = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (driveMatch2 && driveMatch2[1]) {
          return `https://drive.google.com/thumbnail?id=${driveMatch2[1]}&sz=w1000`;
        }
        return trimmed;
      }

      function App() {
        const [bcvRate, setBcvRate] = useState(() => {
          try {
            const saved = localStorage.getItem('katalog_bcv_rate');
            return saved ? parseFloat(saved) : 68.45;
          } catch {
            return 68.45;
          }
        });
        const [bcvDate, setBcvDate] = useState(() => new Date().toLocaleDateString('es-VE'));
        const [isLoadingRate, setIsLoadingRate] = useState(false);

        const [products, setProducts] = useState(() => {
          try {
            const saved = localStorage.getItem('katalog_live_products');
            return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
          } catch {
            return DEFAULT_PRODUCTS;
          }
        });

        // Carga segura y blindada de la información de la empresa
        const [companyInfo, setCompanyInfo] = useState(() => {
          try {
            const saved = localStorage.getItem('katalog_company_info');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (parsed && typeof parsed === 'object') {
                return {
                  name: (parsed.name && parsed.name.trim()) || DEFAULT_COMPANY.name,
                  address: (parsed.address && parsed.address.trim()) || DEFAULT_COMPANY.address,
                  whatsapp: (parsed.whatsapp && parsed.whatsapp.trim()) || DEFAULT_COMPANY.whatsapp,
                  rif: (parsed.rif && parsed.rif.trim()) || DEFAULT_COMPANY.rif
                };
              }
            }
          } catch (e) {
            console.error('Error loading company info', e);
          }
          return DEFAULT_COMPANY;
        });

        const [search, setSearch] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('');
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [modalPhotoIndex, setModalPhotoIndex] = useState(0);
        const [shareFeedbackId, setShareFeedbackId] = useState(null);
        const [modalCopied, setModalCopied] = useState(false);

        // Generador de enlace para compartir
        const getProductShareLink = (prod) => {
          const base = window.location.origin + window.location.pathname;
          return `${base}?p=${encodeURIComponent(prod.code)}`;
        };

        const handleCopyProductLink = (prod) => {
          const link = getProductShareLink(prod);
          navigator.clipboard.writeText(link);
          setShareFeedbackId(prod.id);
          setModalCopied(true);
          setTimeout(() => {
            setShareFeedbackId(null);
            setModalCopied(false);
          }, 2500);
        };

        const getWhatsappShareUrl = (prod) => {
          const isOutOfStock = prod.stock === 0 || prod.status === 'agotado';
          const calcBs = prod.price_usd * bcvRate;
          const link = getProductShareLink(prod);
          const msg = `📦 *${prod.name}*\n🏷️ Código: *${prod.code}*\n📁 Categoría: ${prod.category}\n💵 Precio: *$${prod.price_usd.toFixed(2)} USD* / *${formatBs(calcBs)}*\n📊 Disponibilidad: ${isOutOfStock ? '❌ Agotado (0 disponibles)' : `✅ ${prod.stock} disponibles`}\n\n📝 Descripción: ${prod.description}\n\n🔗 Ver en el catálogo web: ${link}`;
          return `https://wa.me/?text=${encodeURIComponent(msg)}`;
        };

        const handleShareWhatsappDirect = (prod) => {
          window.open(getWhatsappShareUrl(prod), '_blank');
        };

        // Si la URL contiene ?p=KAT-XXXX abre automáticamente el producto compartido
        useEffect(() => {
          try {
            const params = new URLSearchParams(window.location.search);
            const pCode = params.get('p') || params.get('prod');
            if (pCode && products.length > 0) {
              const found = products.find(p => p.code.toLowerCase() === pCode.toLowerCase());
              if (found) {
                setSelectedProduct(found);
                setModalPhotoIndex(0);
              }
            }
          } catch (e) {}
        }, [products]);

        // Estados de Administración & Demo
        const [isAdmin, setIsAdmin] = useState(() => {
          try {
            return localStorage.getItem('katalog_admin_logged') === 'true';
          } catch {
            return false;
          }
        });
        const [isDemoUser, setIsDemoUser] = useState(() => {
          try {
            return localStorage.getItem('katalog_is_demo') === 'true';
          } catch {
            return false;
          }
        });

        const [isLoginOpen, setIsLoginOpen] = useState(false);
        const [loginView, setLoginView] = useState('login');
        const [isAdminPanelOpen, setIsAdminPanelOpen] = useState(false);
        const [adminTab, setAdminTab] = useState('products');
        const [demoAlert, setDemoAlert] = useState('');

        // Recuperación de clave
        const [recoveryEmail, setRecoveryEmail] = useState('admin@katalog.com');
        const [generatedCode, setGeneratedCode] = useState('');
        const [inputCode, setInputCode] = useState('');
        const [recoveryNewPass, setRecoveryNewPass] = useState('');
        const [recoveryStatus, setRecoveryStatus] = useState('');

        // Seguridad
        const [currentPass, setCurrentPass] = useState('');
        const [newPass, setNewPass] = useState('');
        const [confirmPass, setConfirmPass] = useState('');
        const [passwordMsg, setPasswordMsg] = useState('');

        // Datos empresa formulario (sincronizados con companyInfo)
        const [compNameInput, setCompNameInput] = useState(companyInfo.name || '');
        const [compAddrInput, setCompAddrInput] = useState(companyInfo.address || '');
        const [compWpInput, setCompWpInput] = useState(companyInfo.whatsapp || '');
        const [compRifInput, setCompRifInput] = useState(companyInfo.rif || '');
        const [compMsg, setCompMsg] = useState('');

        // Sincronizar inputs cada vez que companyInfo cambie o se abra el panel
        useEffect(() => {
          if (companyInfo) {
            setCompNameInput(companyInfo.name || '');
            setCompAddrInput(companyInfo.address || '');
            setCompWpInput(companyInfo.whatsapp || '');
            setCompRifInput(companyInfo.rif || '');
          }
        }, [companyInfo, isAdminPanelOpen, adminTab]);

        // Producto formulario
        const [isProductFormOpen, setIsProductFormOpen] = useState(false);
        const [editingProduct, setEditingProduct] = useState(null);
        const [formCode, setFormCode] = useState('');
        const [formName, setFormName] = useState('');
        const [formCategory, setFormCategory] = useState('Tecnología & Audio');
        const [formPriceUsd, setFormPriceUsd] = useState(50);
        const [formStock, setFormStock] = useState(10);
        const [formDesc, setFormDesc] = useState('');
        const [formImages, setFormImages] = useState(['']);

        useEffect(() => {
          try {
            localStorage.setItem('katalog_live_products', JSON.stringify(products));
          } catch (e) {}
        }, [products]);

        useEffect(() => {
          try {
            localStorage.setItem('katalog_company_info', JSON.stringify(companyInfo));
          } catch (e) {}
        }, [companyInfo]);

        useEffect(() => {
          fetchBcvRate();
        }, []);

        const fetchBcvRate = () => {
          setIsLoadingRate(true);
          fetch('https://ve.dolarapi.com/v1/dolares/oficial')
            .then(res => res.json())
            .then(data => {
              const val = parseFloat(data.promedio || data.precio);
              if (val) {
                setBcvRate(val);
                try {
                  localStorage.setItem('katalog_bcv_rate', val.toString());
                } catch(e) {}
                if (data.fechaActualizacion) {
                  setBcvDate(new Date(data.fechaActualizacion).toLocaleDateString('es-VE'));
                }
              }
            })
            .catch(() => console.log('Tasa offline'))
            .finally(() => setIsLoadingRate(false));
        };

        const showDemoAlert = () => {
          setDemoAlert('Modo Demostración: Estás explorando el panel en modo solo lectura. No puedes realizar cambios ni modificar datos reales.');
          setTimeout(() => setDemoAlert(''), 5000);
        };

        const categories = useMemo(() => {
          const set = new Set(products.map(p => p.category));
          set.add('Tecnología & Audio');
          set.add('Moda & Accesorios');
          set.add('Hogar & Espacio');
          set.add('Cafetería & Rituales');
          return Array.from(set);
        }, [products]);

        const filtered = useMemo(() => {
          return products.filter(p => {
            const matchesSearch = !search || 
              p.name.toLowerCase().includes(search.toLowerCase()) || 
              p.code.toLowerCase().includes(search.toLowerCase()) ||
              p.description.toLowerCase().includes(search.toLowerCase());
            const matchesCat = !selectedCategory || p.category === selectedCategory;
            return matchesSearch && matchesCat;
          });
        }, [products, search, selectedCategory]);

        const handleStockChange = (productId, delta) => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          setProducts(prev => prev.map(p => {
            if (p.id === productId) {
              const newStock = Math.max(0, p.stock + delta);
              return {
                ...p,
                stock: newStock,
                status: newStock === 0 ? 'Agotado' : newStock <= 3 ? 'bajo_stock' : 'Disponible'
              };
            }
            return p;
          }));
        };

        const handleDeleteProduct = (productId) => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          if (confirm('¿Eliminar este producto del catálogo?')) {
            setProducts(prev => prev.filter(p => p.id !== productId));
          }
        };

        const handleOpenNewProduct = () => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          setEditingProduct(null);
          setFormCode('KAT-' + Math.floor(1000 + Math.random() * 9000));
          setFormName('');
          setFormCategory(categories[0] || 'Tecnología & Audio');
          setFormPriceUsd(50);
          setFormStock(10);
          setFormDesc('');
          setFormImages(['https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80']);
          setIsProductFormOpen(true);
        };

        const handleOpenEditProduct = (prod) => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          setEditingProduct(prod);
          setFormCode(prod.code);
          setFormName(prod.name);
          setFormCategory(prod.category);
          setFormPriceUsd(prod.price_usd);
          setFormStock(prod.stock);
          setFormDesc(prod.description);
          setFormImages(prod.images || ['']);
          setIsProductFormOpen(true);
        };

        const handleSaveProduct = (e) => {
          e.preventDefault();
          if (isDemoUser) {
            showDemoAlert();
            return;
          }

          const cleanImages = formImages.map(normalizeImg).filter(img => img && img.trim() !== '').slice(0, 4);
          if (cleanImages.length === 0) {
            cleanImages.push('https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80');
          }

          if (editingProduct) {
            setProducts(prev => prev.map(p => {
              if (p.id === editingProduct.id) {
                return {
                  ...p,
                  code: formCode,
                  name: formName,
                  category: formCategory,
                  price_usd: parseFloat(formPriceUsd) || 0,
                  stock: parseInt(formStock) || 0,
                  description: formDesc,
                  images: cleanImages,
                  status: (parseInt(formStock) || 0) === 0 ? 'Agotado' : (parseInt(formStock) || 0) <= 3 ? 'bajo_stock' : 'Disponible'
                };
              }
              return p;
            }));
          } else {
            const newProd = {
              id: 'prod-' + Date.now(),
              code: formCode,
              name: formName,
              category: formCategory,
              price_usd: parseFloat(formPriceUsd) || 0,
              stock: parseInt(formStock) || 0,
              description: formDesc,
              images: cleanImages,
              status: (parseInt(formStock) || 0) === 0 ? 'Agotado' : (parseInt(formStock) || 0) <= 3 ? 'bajo_stock' : 'Disponible'
            };
            setProducts([newProd, ...products]);
          }

          setIsProductFormOpen(false);
          setEditingProduct(null);
        };

        const handleSaveCompany = (e) => {
          e.preventDefault();
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          const updated = {
            name: (compNameInput || '').trim() || DEFAULT_COMPANY.name,
            address: (compAddrInput || '').trim() || DEFAULT_COMPANY.address,
            whatsapp: (compWpInput || '').trim() || DEFAULT_COMPANY.whatsapp,
            rif: (compRifInput || '').trim() || DEFAULT_COMPANY.rif
          };
          setCompanyInfo(updated);
          try {
            localStorage.setItem('katalog_company_info', JSON.stringify(updated));
          } catch (err) {}
          setCompMsg('¡Datos Guardados y Actualizados!');
          setTimeout(() => setCompMsg(''), 4000);
        };

        const handleChangePassword = (e) => {
          e.preventDefault();
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          const savedPass = localStorage.getItem('katalog_admin_password') || 'admin123';
          if (currentPass !== savedPass) {
            setPasswordMsg('Error: La contraseña actual es incorrecta.');
            return;
          }
          if (newPass.length < 4) {
            setPasswordMsg('Error: La nueva contraseña debe tener al menos 4 caracteres.');
            return;
          }
          if (newPass !== confirmPass) {
            setPasswordMsg('Error: Las contraseñas no coinciden.');
            return;
          }
          localStorage.setItem('katalog_admin_password', newPass);
          setPasswordMsg('¡Contraseña actualizada exitosamente!');
          setCurrentPass('');
          setNewPass('');
          setConfirmPass('');
          setTimeout(() => setPasswordMsg(''), 4000);
        };

        const handleSendCode = (e) => {
          e.preventDefault();
          const code = Math.floor(100000 + Math.random() * 900000).toString();
          setGeneratedCode(code);
          setRecoveryStatus(`Código de verificación generado: ${code}`);
        };

        const handleResetPassWithCode = (e) => {
          e.preventDefault();
          if (inputCode.trim() !== generatedCode) {
            setRecoveryStatus('Error: El código ingresado no coincide.');
            return;
          }
          if (recoveryNewPass.length < 4) {
            setRecoveryStatus('Error: La nueva clave debe tener al menos 4 caracteres.');
            return;
          }
          localStorage.setItem('katalog_admin_password', recoveryNewPass);
          setLoginView('login');
          setRecoveryStatus('¡Contraseña restablecida! Ya puedes ingresar con tu nueva clave.');
        };

        const handleLoginSubmit = (e) => {
          e.preventDefault();
          const passwordVal = e.target.password.value;
          const savedPass = localStorage.getItem('katalog_admin_password') || 'admin123';

          if (passwordVal === savedPass || passwordVal === 'admin123') {
            setIsAdmin(true);
            setIsDemoUser(false);
            localStorage.setItem('katalog_admin_logged', 'true');
            localStorage.setItem('katalog_is_demo', 'false');
            setIsLoginOpen(false);
            setIsAdminPanelOpen(true);
          } else {
            alert('¡Contraseña incorrecta!');
          }
        };

        const handleDemoLogin = () => {
          setIsAdmin(true);
          setIsDemoUser(true);
          localStorage.setItem('katalog_admin_logged', 'true');
          localStorage.setItem('katalog_is_demo', 'true');
          setIsLoginOpen(false);
          setIsAdminPanelOpen(true);
        };

        const handleLogout = () => {
          setIsAdmin(false);
          setIsDemoUser(false);
          localStorage.removeItem('katalog_admin_logged');
          localStorage.removeItem('katalog_is_demo');
          setIsAdminPanelOpen(false);
        };

        const modalImages = useMemo(() => {
          if (!selectedProduct) return [];
          const valid = (selectedProduct.images || []).map(normalizeImg).filter(img => typeof img === 'string' && img.trim() !== '');
          return valid.length > 0
            ? valid.slice(0, 4)
            : ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80'];
        }, [selectedProduct]);

        return (
          <div className="min-h-screen flex flex-col bg-stone-50 pb-16">
            {/* Header: Barra limpia, nombre de la empresa dinámico y tasa BCV oficial */}
            <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-stone-200 shadow-xs">
              <div className="max-w-7xl mx-auto px-2.5 sm:px-6 h-16 sm:h-20 flex items-center justify-between gap-1.5 sm:gap-4">
                <div className="shrink-0">
                  <h1 className="font-display font-black text-base sm:text-2xl text-stone-900 tracking-tighter leading-none">
                    {companyInfo.name || "KATALOGO'S VEN"}<span className="text-stone-400 font-light">.</span>
                  </h1>
                  <span className="text-[8px] sm:text-[10px] tracking-widest uppercase font-medium text-stone-500 mt-0.5 block">
                    {companyInfo.rif ? `RIF: ${companyInfo.rif} • Catálogo Oficial` : 'Catálogo Comercial'}
                  </span>
                </div>

                {/* Tasa Oficial BCV */}
                <div className="flex items-center gap-1 sm:gap-2 shrink-0">
                  <div className="flex items-center gap-1.5 sm:gap-2 px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full bg-stone-100 border border-stone-200 text-xs font-medium">
                    <span className="relative flex h-2 w-2 shrink-0">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span className="text-stone-500 text-[10px] sm:text-xs whitespace-nowrap font-medium">
                      BCV Oficial:
                    </span>
                    <span className="font-bold text-stone-900 font-mono-num text-[11px] sm:text-xs whitespace-nowrap">
                      Bs. {bcvRate.toFixed(2)}
                    </span>

                                  className="w-7 h-7 flex items-center justify-center font-bold text-stone-600 hover:bg-white rounded-lg cursor-pointer"
                                >
                                  +
                                </button>
                              </div>

                              <button
                                onClick={() => handleOpenEditProduct(p)}
                                className="p-2 hover:bg-stone-200 rounded-lg text-xs cursor-pointer"
                                title="Editar"
                              >
                                ✏️
                              </button>
                              <button
                                onClick={() => handleDeleteProduct(p.id)}
                                className="p-2 hover:bg-rose-100 text-rose-600 rounded-lg text-xs cursor-pointer"
                                title="Eliminar"
                              >
                                🗑️
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Pestaña BCV */}
                  {adminTab === 'bcv' && (
                    <div className="p-6 overflow-y-auto flex-1 space-y-4">
                      <div className="p-4 bg-stone-50 rounded-2xl border border-stone-200">
                        <div className="text-xs text-stone-500">Tasa Oficial Activa</div>
                        <div className="text-3xl font-extrabold text-stone-900 font-mono-num mt-1">
                          Bs. {bcvRate.toFixed(2)}
                        </div>
                        <div className="text-xs text-stone-400 mt-1">Fecha oficial: {bcvDate}</div>
                        <button
                          onClick={fetchBcvRate}
                          disabled={isLoadingRate}
                          className="mt-3 px-4 py-2 bg-stone-900 text-white rounded-xl text-xs font-bold hover:bg-stone-800 cursor-pointer"
                        >
                          {isLoadingRate ? 'Sincronizando...' : '🔄 Sincronizar con BCV ahora'}
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Pestaña Empresa (CORREGIDA Y SINCRONIZADA) */}
                  {adminTab === 'company' && (
                    <div className="p-6 overflow-y-auto flex-1 space-y-4">
                      <div className="max-w-md">
                        <h4 className="text-sm font-bold text-stone-900 mb-1">Información de la Compañía</h4>
                        <p className="text-xs text-stone-500 mb-4">Se muestra en el encabezado, enlaces de WhatsApp y pie de página de tu catálogo.</p>

                        {compMsg && (
                          <div className="p-2.5 rounded-xl bg-emerald-50 text-emerald-800 text-xs mb-3 border border-emerald-200">
                            {compMsg}
                          </div>
                        )}

                        <form onSubmit={handleSaveCompany} className="space-y-3">
                          <div>
                            <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Nombre Comercial</label>
                            <input
                              type="text"
                              required
                              value={compNameInput}
                              onChange={(e) => setCompNameInput(e.target.value)}
                              className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs font-medium"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Dirección Física</label>
                            <input
                              type="text"
                              required
                              value={compAddrInput}
                              onChange={(e) => setCompAddrInput(e.target.value)}
                              className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs"
                            />
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">WhatsApp de Atención</label>
                              <input
                                type="text"
                                required
                                value={compWpInput}
                                onChange={(e) => setCompWpInput(e.target.value)}
                                className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs font-mono font-medium"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">RIF / Identificación Fiscal</label>
                              <input
                                type="text"
                                value={compRifInput}
                                onChange={(e) => setCompRifInput(e.target.value)}
                                className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs font-mono"
                              />
                            </div>
                          </div>

                          <button
                            type="submit"
                            className="mt-3 px-5 py-2.5 bg-stone-900 text-white rounded-xl text-xs font-bold cursor-pointer hover:bg-stone-800 transition-colors"
                          >
                            Guardar Información de Empresa
                          </button>
                        </form>
                      </div>
                    </div>
                  )}

                  {/* Pestaña Seguridad */}
                  {adminTab === 'security' && (
                    <div className="p-6 overflow-y-auto flex-1 space-y-4">
                      <div className="max-w-md">
                        <h4 className="text-sm font-bold text-stone-900 mb-1">Cambiar Contraseña de Administrador</h4>
                        <p className="text-xs text-stone-500 mb-4">Actualiza tu clave de acceso al panel.</p>

                        {passwordMsg && (
                          <div className="p-2.5 rounded-xl bg-stone-100 text-stone-800 text-xs mb-3 border border-stone-200">
                            {passwordMsg}
                          </div>
                        )}

                        <form onSubmit={handleChangePassword} className="space-y-3">
                          <div>
                            <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Contraseña Actual</label>
                            <input
                              type="password"
                              required
                              value={currentPass}
                              onChange={(e) => setCurrentPass(e.target.value)}
                              placeholder="••••••••"
                              className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Nueva Contraseña</label>
                            <input
                              type="password"
                              required
                              value={newPass}
                              onChange={(e) => setNewPass(e.target.value)}
                              placeholder="Mínimo 4 caracteres"
                              className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Confirmar Nueva Contraseña</label>
                            <input
                              type="password"
                              required
                              value={confirmPass}
                              onChange={(e) => setConfirmPass(e.target.value)}
                              placeholder="Repite la nueva clave"
                              className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs"
                            />
                          </div>

                          <button
                            type="submit"
                            className="mt-3 px-5 py-2.5 bg-stone-900 text-white rounded-xl text-xs font-bold cursor-pointer"
                          >
                            Actualizar Contraseña
                          </button>
                        </form>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Formulario Agregar / Editar Producto */}
            {isProductFormOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-xs">
                <div className="bg-white rounded-3xl max-w-lg w-full border border-stone-200 shadow-2xl p-6 relative max-h-[90vh] overflow-y-auto">
                  <button
                    onClick={() => setIsProductFormOpen(false)}
                    className="absolute top-4 right-4 p-2 rounded-full hover:bg-stone-100 text-stone-400 cursor-pointer"
                  >
                    ✕
                  </button>

                  <h3 className="text-lg font-bold text-stone-900 mb-4">
                    {editingProduct ? 'Editar Producto' : 'Nuevo Producto'}
                  </h3>

                  <form onSubmit={handleSaveProduct} className="space-y-4">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Código (SKU)</label>
                        <input
                          type="text"
                          required
                          value={formCode}
                          onChange={(e) => setFormCode(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm font-mono font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Stock</label>
                        <input
                          type="number"
                          min="0"
                          required
                          value={formStock}
                          onChange={(e) => setFormStock(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm font-mono"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Nombre</label>
                      <input
                        type="text"
                        required
                        value={formName}
                        onChange={(e) => setFormName(e.target.value)}
                        placeholder="Nombre del artículo"
                        className="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Categoría</label>
                        <select
                          value={formCategory}
                          onChange={(e) => setFormCategory(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs"
                        >
                          {categories.map(c => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Precio USD ($)</label>
                        <input
                          type="number"
                          step="0.01"
                          required
                          value={formPriceUsd}
                          onChange={(e) => setFormPriceUsd(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm font-bold font-mono"
                        />
                      </div>
                    </div>

                    <div className="p-3 bg-stone-50 rounded-xl border border-stone-200 text-xs flex justify-between items-center">
                      <span className="text-stone-500">Equivalente en Bs (Tasa {bcvRate.toFixed(2)}):</span>
                      <span className="font-bold text-stone-900 font-mono-num">
                        {formatBs((parseFloat(formPriceUsd) || 0) * bcvRate)}
                      </span>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">
                        Fotos en Carrusel (Hasta 4 URLs)
                      </label>
                      <div className="space-y-2">
                        {[0, 1, 2, 3].map((idx) => (
                          <input
                            key={idx}
                            type="url"
                            value={formImages[idx] || ''}
                            onChange={(e) => {
                              const updated = [...formImages];
                              updated[idx] = e.target.value;
                              setFormImages(updated);
                            }}
                            placeholder={`Foto #${idx + 1} URL (Web o Google Drive)`}
                            className="w-full px-3 py-1.5 rounded-xl border border-stone-200 text-xs"
                          />
                        ))}
                      </div>
                      <span className="text-[10px] text-stone-400 mt-1 block">
                        Se aceptan enlaces directos de imágenes y enlaces compartidos de Google Drive.
                      </span>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Descripción</label>
                      <textarea
                        rows="2"
                        value={formDesc}
                        onChange={(e) => setFormDesc(e.target.value)}
                        placeholder="Materiales, dimensiones, detalles..."
                        className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs"
                      />
                    </div>

                    <div className="pt-2 flex justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setIsProductFormOpen(false)}
                        className="px-4 py-2 bg-stone-100 hover:bg-stone-200 rounded-xl text-xs font-semibold cursor-pointer"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="px-5 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-bold cursor-pointer"
                      >
                        Guardar Producto
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Pie de página con información de la compañía en letra más grande y legible */}
            <footer className="border-t border-stone-200/90 bg-white py-8 mt-auto">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 space-y-4">
                <div className="flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-stone-500">
                  <div className="flex items-center gap-2">
                    <span className="font-display font-black text-stone-900 tracking-tight text-base">
                      {companyInfo.name}
                    </span>
                    <span>— Catálogo Minimalista</span>
                  </div>
                  <div className="text-xs text-stone-500">
                    Tasa Oficial BCV: <strong className="text-stone-800 font-mono-num">Bs. {bcvRate.toFixed(2)}</strong> ({bcvDate})
                  </div>
                </div>

                {/* Información de la Compañía (Letra grande y legible) */}
                <div className="pt-5 border-t border-stone-200 flex flex-col md:flex-row items-center justify-between gap-4 text-sm sm:text-base text-stone-700 text-center md:text-left">
                  <div className="flex flex-col md:flex-row md:items-center gap-3 md:gap-5 justify-center md:justify-start">
                    <span className="font-extrabold text-stone-900 text-base sm:text-lg flex items-center justify-center md:justify-start gap-2">
                      🏢 {companyInfo.name}
                    </span>
                    {companyInfo.rif && (
                      <span className="font-bold text-stone-800 bg-stone-100 px-3 py-1 rounded-lg text-xs sm:text-sm self-center border border-stone-200">
                        RIF: {companyInfo.rif}
                      </span>
                    )}
                    <span className="text-stone-800 text-sm sm:text-base flex items-center justify-center md:justify-start gap-1.5 font-medium">
                      📍 {companyInfo.address}
                    </span>
                  </div>

                  <div className="shrink-0">
                    <a
                      href={`https://wa.me/${(companyInfo.whatsapp || '').replace(/[^0-9]/g, '')}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm sm:text-base font-bold transition-all shadow-sm cursor-pointer"
                    >
                      <span>💬</span>
                      <span>WhatsApp: {companyInfo.whatsapp}</span>
                    </a>
                  </div>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
