<!doctype html>
<html lang="es" class="h-full bg-stone-50 text-stone-900 antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Katalog Minimal - Catálogo Minimalista con Tasa BCV & Panel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-display { font-family: 'Space Grotesk', sans-serif; }
      .font-mono-num { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body class="h-full bg-stone-50 text-stone-900 font-sans selection:bg-stone-900 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      const DEFAULT_PRODUCTS = [
        {
          id: 'prod-001',
          code: 'AUD-9010',
          name: 'Auriculares Supraaurales Studio One',
          description: 'Almohadillas de cuero suave y estructura de aluminio anodizado mate. Cancelación de ruido activa híbrida y transductores de 40mm. Batería de 38 horas continuas.',
          price_usd: 185.0,
          stock: 14,
          status: 'disponible',
          category: 'Tecnología & Audio',
          images: [
            'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1484704849700-f032a568e944?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-002',
          code: 'SPK-3340',
          name: 'Altavoz Portátil en Cilindro de Hormigón & Lana',
          description: 'Caja acústica monocromática con base de hormigón ligero y rejilla de lana nórdica. Conexión True Wireless Stereo y carga USB-C rápida.',
          price_usd: 120.0,
          stock: 6,
          status: 'disponible',
          category: 'Tecnología & Audio',
          images: [
            'https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-003',
          code: 'ACC-1102',
          name: 'Tarjetero Minimal en Cuero Vachetta Natural',
          description: 'Confeccionado a mano con curtido vegetal italiano sin tratamientos químicos. Capacidad para 6 tarjetas y compartimento central.',
          price_usd: 48.0,
          stock: 2,
          status: 'bajo_stock',
          category: 'Moda & Accesorios',
          images: [
            'https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-004',
          code: 'LMP-4028',
          name: 'Lámpara de Sobremesa Aura en Travertino',
          description: 'Pieza de iluminación arquitectónica en bloque de travertino con difusor de vidrio opal soplado artesanalmente.',
          price_usd: 215.0,
          stock: 5,
          status: 'disponible',
          category: 'Hogar & Espacio',
          images: [
            'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-005',
          code: 'COF-7015',
          name: 'Cafetera de Goteo en Vidrio Borosilicato',
          description: 'Set pour-over de borosilicato resistente a choques térmicos con collarín de nogal negro y cordón de cuero crudo.',
          price_usd: 62.0,
          stock: 8,
          status: 'disponible',
          category: 'Cafetería & Rituales',
          images: [
            'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80'
          ]
        },
        {
          id: 'prod-006',
          code: 'OPT-5104',
          name: 'Gafas de Sol Silueta Octogonal en Titanio',
          description: 'Montura ultraligera moldeada en titanio japonés ionizado mate. Cristales minerales UV400 y peso de 16 gramos.',
          price_usd: 155.0,
          stock: 4,
          status: 'disponible',
          category: 'Moda & Accesorios',
          images: [
            'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80'
          ]
        }
      ];

      const DEFAULT_COMPANY = {
        name: 'Katalog Minimal C.A.',
        address: 'Av. Francisco de Miranda, Edif. Centro Cristal, Piso 4, Caracas, Venezuela',
        whatsapp: '+58 412 1234567',
        rif: 'J-50123456-7'
      };

      function formatBs(amount) {
        return 'Bs. ' + Number(amount).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function formatUsd(amount) {
        return '$' + Number(amount).toFixed(2);
      }

      function App() {
        const [bcvRate, setBcvRate] = useState(() => {
          const saved = localStorage.getItem('katalog_bcv_rate');
          return saved ? parseFloat(saved) : 68.45;
        });
        const [bcvDate, setBcvDate] = useState(new Date().toLocaleDateString('es-VE'));
        const [isLoadingRate, setIsLoadingRate] = useState(false);

        const [products, setProducts] = useState(() => {
          const saved = localStorage.getItem('katalog_live_products');
          return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
        });

        const [companyInfo, setCompanyInfo] = useState(() => {
          const saved = localStorage.getItem('katalog_company_info');
          return saved ? JSON.parse(saved) : DEFAULT_COMPANY;
        });

        const [search, setSearch] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('');
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [modalPhotoIndex, setModalPhotoIndex] = useState(0);

        const [isAdmin, setIsAdmin] = useState(() => {
          return localStorage.getItem('katalog_admin_logged') === 'true';
        });
        const [isDemoUser, setIsDemoUser] = useState(() => {
          return localStorage.getItem('katalog_is_demo') === 'true';
        });

        const [isLoginOpen, setIsLoginOpen] = useState(false);
        const [loginView, setLoginView] = useState('login');
        const [isAdminPanelOpen, setIsAdminPanelOpen] = useState(false);
        const [adminTab, setAdminTab] = useState('products');
        const [demoAlert, setDemoAlert] = useState('');

        const [recoveryEmail, setRecoveryEmail] = useState('admin@katalog.com');
        const [generatedCode, setGeneratedCode] = useState('');
        const [inputCode, setInputCode] = useState('');
        const [recoveryNewPass, setRecoveryNewPass] = useState('');
        const [recoveryStatus, setRecoveryStatus] = useState('');

        const [currentPass, setCurrentPass] = useState('');
        const [newPass, setNewPass] = useState('');
        const [confirmPass, setConfirmPass] = useState('');
        const [passwordMsg, setPasswordMsg] = useState('');

        const [compNameInput, setCompNameInput] = useState(companyInfo.name);
        const [compAddrInput, setCompAddrInput] = useState(companyInfo.address);
        const [compWpInput, setCompWpInput] = useState(companyInfo.whatsapp);
        const [compRifInput, setCompRifInput] = useState(companyInfo.rif);
        const [compMsg, setCompMsg] = useState('');

        const [isProductFormOpen, setIsProductFormOpen] = useState(false);
        const [editingProduct, setEditingProduct] = useState(null);
        const [formCode, setFormCode] = useState('');
        const [formName, setFormName] = useState('');
        const [formCategory, setFormCategory] = useState('Tecnología & Audio');
        const [formPriceUsd, setFormPriceUsd] = useState(50);
        const [formStock, setFormStock] = useState(10);
        const [formDesc, setFormDesc] = useState('');
        const [formImages, setFormImages] = useState(['']);

        useEffect(() => {
          localStorage.setItem('katalog_live_products', JSON.stringify(products));
        }, [products]);

        useEffect(() => {
          localStorage.setItem('katalog_company_info', JSON.stringify(companyInfo));
        }, [companyInfo]);

        useEffect(() => {
          fetchBcvRate();
        }, []);

        const fetchBcvRate = () => {
          setIsLoadingRate(true);
          fetch('https://ve.dolarapi.com/v1/dolares/oficial')
            .then(res => res.json())
            .then(data => {
              const val = parseFloat(data.promedio || data.precio);
              if (val) {
                setBcvRate(val);
                if (data.fechaActualizacion) {
                  setBcvDate(new Date(data.fechaActualizacion).toLocaleDateString('es-VE'));
                }
              }
            })
            .catch(() => console.log('Tasa offline'))
            .finally(() => setIsLoadingRate(false));
        };

        const showDemoAlert = () => {
          setDemoAlert('Modo Demostración: Estás explorando el panel en modo solo lectura. No puedes realizar cambios ni modificar datos reales.');
          setTimeout(() => setDemoAlert(''), 5000);
        };

        const categories = useMemo(() => {
          const set = new Set(products.map(p => p.category));
          set.add('Tecnología & Audio');
          set.add('Moda & Accesorios');
          set.add('Hogar & Espacio');
          set.add('Cafetería & Rituales');
          return Array.from(set);
        }, [products]);

        const filtered = useMemo(() => {
          return products.filter(p => {
            const matchesSearch = !search || 
              p.name.toLowerCase().includes(search.toLowerCase()) || 
              p.code.toLowerCase().includes(search.toLowerCase()) ||
              p.description.toLowerCase().includes(search.toLowerCase());
            const matchesCat = !selectedCategory || p.category === selectedCategory;
            return matchesSearch && matchesCat;
          });
        }, [products, search, selectedCategory]);

        const handleStockChange = (productId, delta) => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          setProducts(prev => prev.map(p => {
            if (p.id === productId) {
              const newStock = Math.max(0, p.stock + delta);
              return {
                ...p,
                stock: newStock,
                status: newStock === 0 ? 'agotado' : newStock <= 3 ? 'bajo_stock' : 'disponible'
              };
            }
            return p;
          }));
        };

        const handleDeleteProduct = (productId) => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          if (confirm('¿Eliminar este producto del catálogo?')) {
            setProducts(prev => prev.filter(p => p.id !== productId));
          }
        };

        const handleOpenNewProduct = () => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          setEditingProduct(null);
          setFormCode('KAT-' + Math.floor(1000 + Math.random() * 9000));
          setFormName('');
          setFormCategory(categories[0] || 'Tecnología & Audio');
          setFormPriceUsd(50);
          setFormStock(10);
          setFormDesc('');
          setFormImages(['https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80']);
          setIsProductFormOpen(true);
        };

        const handleOpenEditProduct = (prod) => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          setEditingProduct(prod);
          setFormCode(prod.code);
          setFormName(prod.name);
          setFormCategory(prod.category);
          setFormPriceUsd(prod.price_usd);
          setFormStock(prod.stock);
          setFormDesc(prod.description);
          setFormImages(prod.images || ['']);
          setIsProductFormOpen(true);
        };

        const handleSaveProduct = (e) => {
          e.preventDefault();
          if (isDemoUser) {
            showDemoAlert();
            return;
          }

          const cleanImages = formImages.filter(img => img && img.trim() !== '').slice(0, 4);
          if (cleanImages.length === 0) {
            cleanImages.push('https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80');
          }

          if (editingProduct) {
            setProducts(prev => prev.map(p => {
              if (p.id === editingProduct.id) {
                return {
                  ...p,
                  code: formCode,
                  name: formName,
                  category: formCategory,
                  price_usd: parseFloat(formPriceUsd) || 0,
                  stock: parseInt(formStock) || 0,
                  description: formDesc,
                  images: cleanImages,
                  status: (parseInt(formStock) || 0) === 0 ? 'agotado' : (parseInt(formStock) || 0) <= 3 ? 'bajo_stock' : 'disponible'
                };
              }
              return p;
            }));
          } else {
            const newProd = {
              id: 'prod-' + Date.now(),
              code: formCode,
              name: formName,
              category: formCategory,
              price_usd: parseFloat(formPriceUsd) || 0,
              stock: parseInt(formStock) || 0,
              description: formDesc,
              images: cleanImages,
              status: (parseInt(formStock) || 0) === 0 ? 'agotado' : (parseInt(formStock) || 0) <= 3 ? 'bajo_stock' : 'disponible'
            };
            setProducts([newProd, ...products]);
          }

          setIsProductFormOpen(false);
          setEditingProduct(null);
        };

        const handleSaveCompany = (e) => {
          e.preventDefault();
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          const updated = {
            name: compNameInput.trim(),
            address: compAddrInput.trim(),
            whatsapp: compWpInput.trim(),
            rif: compRifInput.trim()
          };
          setCompanyInfo(updated);
          setCompMsg('Datos de la empresa guardados correctamente.');
          setTimeout(() => setCompMsg(''), 4000);
        };

        const handleChangePassword = (e) => {
          e.preventDefault();
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          const savedPass = localStorage.getItem('katalog_admin_password') || 'admin123';
          if (currentPass !== savedPass) {
            setPasswordMsg('Error: La contraseña actual es incorrecta.');
            return;
          }
          if (newPass.length < 4) {
            setPasswordMsg('Error: La nueva contraseña debe tener al menos 4 caracteres.');
            return;
          }
          if (newPass !== confirmPass) {
            setPasswordMsg('Error: Las contraseñas no coinciden.');
            return;
          }
          localStorage.setItem('katalog_admin_password', newPass);
          setPasswordMsg('¡Contraseña actualizada exitosamente!');
          setCurrentPass('');
          setNewPass('');
          setConfirmPass('');
          setTimeout(() => setPasswordMsg(''), 4000);
        };

        const handleSendCode = (e) => {
          e.preventDefault();
          const code = Math.floor(100000 + Math.random() * 900000).toString();
          setGeneratedCode(code);
          setRecoveryStatus(`Código de verificación: ${code}`);
        };

        const handleResetPassWithCode = (e) => {
          e.preventDefault();
          if (inputCode.trim() !== generatedCode) {
            setRecoveryStatus('Error: El código ingresado no coincide.');
            return;
          }
          if (recoveryNewPass.length < 4) {
            setRecoveryStatus('Error: La nueva clave debe tener al menos 4 caracteres.');
            return;
          }
          localStorage.setItem('katalog_admin_password', recoveryNewPass);
          setLoginView('login');
          setRecoveryStatus('¡Contraseña restablecida! Ya puedes ingresar con tu nueva clave.');
        };

        const handleLoginSubmit = (e) => {
          e.preventDefault();
          const passwordVal = e.target.password.value;
          const savedPass = localStorage.getItem('katalog_admin_password') || 'admin123';

          if (passwordVal === savedPass || passwordVal === 'admin123') {
            setIsAdmin(true);
            setIsDemoUser(false);
            localStorage.setItem('katalog_admin_logged', 'true');
            localStorage.setItem('katalog_is_demo', 'false');
            setIsLoginOpen(false);
            setIsAdminPanelOpen(true);
          } else {
            alert('Contraseña incorrecta. Usa "admin123" o recupera tu contraseña.');
          }
        };

        const handleDemoLogin = () => {
          setIsAdmin(true);
          setIsDemoUser(true);
          localStorage.setItem('katalog_admin_logged', 'true');
          localStorage.setItem('katalog_is_demo', 'true');
          setIsLoginOpen(false);
          setIsAdminPanelOpen(true);
        };

        const handleLogout = () => {
          setIsAdmin(false);
          setIsDemoUser(false);
          localStorage.removeItem('katalog_admin_logged');
          localStorage.removeItem('katalog_is_demo');
          setIsAdminPanelOpen(false);
        };

        const modalImages = useMemo(() => {
          if (!selectedProduct) return [];
          const valid = (selectedProduct.images || []).filter(img => typeof img === 'string' && img.trim() !== '');
          return valid.length > 0
            ? valid.slice(0, 4)
            : ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80'];
        }, [selectedProduct]);

        return (
          <div className="min-h-screen flex flex-col bg-stone-50 pb-16">
            {/* Header */}
            <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-stone-200 shadow-xs">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
                <div>
                  <h1 className="font-display font-black text-xl sm:text-2xl text-stone-900 tracking-tighter">
                    KATALOG<span className="text-stone-400">.</span>
                  </h1>
                  <span className="text-[10px] tracking-widest uppercase font-medium text-stone-500">
                    Catálogo Minimalista
                  </span>
                </div>

                <div className="flex items-center gap-2 sm:gap-3">
                  <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-stone-100 border border-stone-200 text-xs font-medium">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span className="text-stone-500 hidden sm:inline">BCV Oficial:</span>
                    <span className="font-bold text-stone-900 font-mono-num">Bs. {bcvRate.toFixed(2)}</span>
                    <span className="text-[10px] text-stone-400 border-l border-stone-300 pl-1.5 hidden md:inline">{bcvDate}</span>
                  </div>

                  {isAdmin ? (
                    <button
                      onClick={() => setIsAdminPanelOpen(true)}
                      className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold shadow-xs cursor-pointer"
                    >
                      <span>⚙️</span>
                      <span className="hidden sm:inline">Panel Admin</span>
                      <span className="sm:hidden">Admin</span>
                    </button>
                  ) : (
                    <button
                      onClick={() => {
                        setLoginView('login');
                        setIsLoginOpen(true);
                      }}
                      className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-stone-900 hover:bg-stone-800 text-white text-xs font-semibold shadow-xs cursor-pointer"
                    >
                      <span>🔒</span>
                      <span>Acceso Admin</span>
                    </button>
                  )}
                </div>
              </div>
            </header>

            {/* Main Content */}
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">
              {/* Buscador y Lista de Categorías */}
              <div className="mb-6 flex flex-col sm:flex-row gap-3">
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Buscar por nombre, código (SKU) o características..."
                  className="flex-1 px-4 py-2.5 bg-white border border-stone-200 rounded-xl text-sm shadow-xs focus:outline-none focus:ring-2 focus:ring-stone-900"
                />

                <select
                  value={selectedCategory}
                  onChange={(e) => setSelectedCategory(e.target.value)}
                  className="px-4 py-2.5 bg-white border border-stone-200 rounded-xl text-xs font-semibold text-stone-800 shadow-xs focus:outline-none focus:ring-2 focus:ring-stone-900 cursor-pointer min-w-[200px]"
                >
                  <option value="">Todas las categorías ({products.length})</option>
                  {categories.map(cat => (
                    <option key={cat} value={cat}>{cat}</option>
                  ))}
                </select>

                {isAdmin && !isDemoUser && (
                  <button
                    onClick={handleOpenNewProduct}
                    className="px-4 py-2.5 bg-stone-900 hover:bg-stone-800 text-white font-semibold text-xs rounded-xl shadow-xs flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap"
                  >
                    + Nuevo Producto
                  </button>
                )}
              </div>

              {/* Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                {filtered.map(product => {
                  const calculatedBs = product.price_usd * bcvRate;
                  const validImgs = (product.images || []).filter(img => img && img.trim() !== '');
                  const coverImage = validImgs.length > 0 ? validImgs[0] : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80';

                  return (
                    <div
                      key={product.id}
                      onClick={() => {
                        setSelectedProduct(product);
                        setModalPhotoIndex(0);
                      }}
                      className="group bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-xs hover:shadow-lg transition-all cursor-pointer flex flex-col justify-between"
                    >
                      <div className="relative aspect-square overflow-hidden bg-stone-100">
                        <img
                          src={coverImage}
                          alt={product.name}
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        />
                        <div className="absolute top-3 left-3 bg-stone-900/80 backdrop-blur-md text-white text-[11px] font-mono px-2 py-1 rounded-md font-bold">
                          CÓD: {product.code}
                        </div>
                        <div className="absolute top-3 right-3 bg-white/90 backdrop-blur-md text-stone-800 text-[11px] px-2 py-1 rounded-md font-medium">
                          {product.category}
                        </div>
                        <div className="absolute bottom-3 left-3 bg-stone-900/80 backdrop-blur-md text-white text-[11px] px-2 py-1 rounded-md flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                          <span>{product.stock} disponibles</span>
                        </div>
                      </div>

                      <div className="p-4 flex-1 flex flex-col justify-between">
                        <div>
                          <h3 className="font-bold text-stone-900 line-clamp-1">{product.name}</h3>
                          <p className="text-xs text-stone-500 mt-1 line-clamp-2">{product.description}</p>
                        </div>
                        <div className="mt-4 pt-3 border-t border-stone-100 flex items-baseline justify-between">
                          <div>
                            <span className="text-[10px] text-stone-400 uppercase font-semibold block">USD</span>
                            <span className="text-lg font-bold text-stone-900 font-mono-num">{formatUsd(product.price_usd)}</span>
                          </div>
                          <div className="text-right">
                            <span className="text-[10px] text-stone-400 font-semibold block">TASA BCV</span>
                            <span className="text-sm font-bold text-stone-700 font-mono-num">{formatBs(calculatedBs)}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>

            {/* Botón Flotante Permanente */}
            <div className="fixed bottom-5 right-5 z-40">
              <button
                onClick={() => {
                  if (isAdmin) {
                    setIsAdminPanelOpen(true);
                  } else {
                    setLoginView('login');
                    setIsLoginOpen(true);
                  }
                }}

                          required
                          value={formCode}
                          onChange={(e) => setFormCode(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm font-mono font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Stock</label>
                        <input
                          type="number"
                          min="0"
                          required
                          value={formStock}
                          onChange={(e) => setFormStock(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm font-mono"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Nombre</label>
                      <input
                        type="text"
                        required
                        value={formName}
                        onChange={(e) => setFormName(e.target.value)}
                        placeholder="Nombre del artículo"
                        className="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Categoría</label>
                        <select
                          value={formCategory}
                          onChange={(e) => setFormCategory(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs"
                        >
                          {categories.map(c => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Precio USD ($)</label>
                        <input
                          type="number"
                          step="0.01"
                          required
                          value={formPriceUsd}
                          onChange={(e) => setFormPriceUsd(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-stone-200 text-sm font-bold font-mono"
                        />
                      </div>
                    </div>

                    <div className="p-3 bg-stone-50 rounded-xl border border-stone-200 text-xs flex justify-between items-center">
                      <span className="text-stone-500">Equivalente en Bs (Tasa {bcvRate.toFixed(2)}):</span>
                      <span className="font-bold text-stone-900 font-mono-num">
                        {formatBs((parseFloat(formPriceUsd) || 0) * bcvRate)}
                      </span>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">
                        Fotos en Carrusel (Hasta 4 URLs)
                      </label>
                      <div className="space-y-2">
                        {[0, 1, 2, 3].map((idx) => (
                          <input
                            key={idx}
                            type="url"
                            value={formImages[idx] || ''}
                            onChange={(e) => {
                              const updated = [...formImages];
                              updated[idx] = e.target.value;
                              setFormImages(updated);
                            }}
                            placeholder={`Foto #${idx + 1} URL (https://images.unsplash...)`}
                            className="w-full px-3 py-1.5 rounded-xl border border-stone-200 text-xs"
                          />
                        ))}
                      </div>
                      <span className="text-[10px] text-stone-400 mt-1 block">
                        Solo se mostrarán las fotos que coloques. Si no colocas ninguna, queda una por defecto automáticamente.
                      </span>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Descripción</label>
                      <textarea
                        rows="2"
                        value={formDesc}
                        onChange={(e) => setFormDesc(e.target.value)}
                        placeholder="Materiales, dimensiones, detalles..."
                        className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs"
                      />
                    </div>

                    <div className="pt-2 flex justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setIsProductFormOpen(false)}
                        className="px-4 py-2 bg-stone-100 hover:bg-stone-200 rounded-xl text-xs font-semibold cursor-pointer"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="px-5 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-bold cursor-pointer"
                      >
                        Guardar Producto
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Pie de página con información de la compañía en letras pequeñas */}
            <footer className="border-t border-stone-200/90 bg-white py-6 mt-auto">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 space-y-3">
                <div className="flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-stone-500">
                  <div className="font-display font-black text-stone-900 tracking-tight text-sm">
                    KATALOG<span className="text-stone-400">.</span>
                  </div>
                  <div className="text-[11px] text-stone-400">
                    Tasa Oficial BCV: Bs. {bcvRate.toFixed(2)} ({bcvDate})
                  </div>
                </div>

                <div className="pt-3 border-t border-stone-100 flex flex-col sm:flex-row flex-wrap items-center justify-between gap-2 text-[11px] text-stone-400 text-center sm:text-left">
                  <div className="flex flex-wrap items-center gap-x-3 gap-y-1 justify-center sm:justify-start">
                    <span className="font-semibold text-stone-700">{companyInfo.name}</span>
                    {companyInfo.rif && <span>• RIF: {companyInfo.rif}</span>}
                    <span>• {companyInfo.address}</span>
                  </div>

                  <div>
                    <a
                      href={`https://wa.me/${companyInfo.whatsapp.replace(/[^0-9]/g, '')}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-emerald-700 hover:text-emerald-800 font-medium transition-colors"
                    >
                      WhatsApp: {companyInfo.whatsapp}
                    </a>
                  </div>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
