<!doctype html>
<html lang="es" class="h-full bg-stone-50 text-stone-900 antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Katalogo's VEN</title>
    <!-- Tailwind CSS y Fuentes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-display { font-family: 'Space Grotesk', sans-serif; }
      .font-mono-num { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body class="h-full bg-stone-50 text-stone-900 font-sans selection:bg-stone-900 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // 🔑 CONFIGURA TUS CREDENCIALES DE SUPABASE AQUÍ
      const SUPABASE_URL = 'https://lxlxymsvvhccoluuivxx.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4bHh5bXN2dmhjY29sdXVpdnh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NDU0OTMsImV4cCI6MjEwODEyMTQ5M30.HU-Oi1veAcwagCml94VTUIMM0DK93QnEsJJpSbXMsVU';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const DEFAULT_COMPANY = {
        name: 'Katalog Minimal C.A.',
        address: 'Av. Francisco de Miranda, Edif. Centro Cristal, Piso 4, Caracas, Venezuela',
        whatsapp: '+58 412 1234567',
        rif: 'J-50123456-7'
      };

      function formatBs(amount) {
        return 'Bs. ' + Number(amount).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function formatUsd(amount) {
        return '$' + Number(amount).toFixed(2);
      }

      function App() {
        const [bcvRate, setBcvRate] = useState(68.45);
        const [bcvDate, setBcvDate] = useState(new Date().toLocaleDateString('es-VE'));
        const [isLoadingRate, setIsLoadingRate] = useState(false);

        const [products, setProducts] = useState([]);
        const [companyInfo, setCompanyInfo] = useState(DEFAULT_COMPANY);

        const [search, setSearch] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('');
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [modalPhotoIndex, setModalPhotoIndex] = useState(0);
        const [shareFeedbackId, setShareFeedbackId] = useState(null);
        const [modalCopied, setModalCopied] = useState(false);

        // Cargar productos desde Supabase al iniciar
        useEffect(() => {
          async function fetchProductsFromCloud() {
            try {
              const { data, error } = await supabase.from('products').select('*');
              if (data && data.length > 0) {
                setProducts(data);
              }
            } catch (err) {
              console.error('Error cargando desde Supabase:', err);
            }
          }
          fetchProductsFromCloud();
          fetchBcvRate();
        }, []);

        const fetchBcvRate = () => {
          setIsLoadingRate(true);
          fetch('https://ve.dolarapi.com/v1/dolares/oficial')
            .then(res => res.json())
            .then(data => {
              const val = parseFloat(data.promedio || data.precio);
              if (val) {
                setBcvRate(val);
                if (data.fechaActualizacion) {
                  setBcvDate(new Date(data.fechaActualizacion).toLocaleDateString('es-VE'));
                }
              }
            })
            .catch(() => console.log('Tasa offline'))
            .finally(() => setIsLoadingRate(false));
        };

        const getProductShareLink = (prod) => {
          const base = window.location.origin + window.location.pathname;
          return `${base}?p=${encodeURIComponent(prod.code)}`;
        };

        const handleCopyProductLink = (prod) => {
          const link = getProductShareLink(prod);
          navigator.clipboard.writeText(link);
          setShareFeedbackId(prod.id);
          setModalCopied(true);
          setTimeout(() => {
            setShareFeedbackId(null);
            setModalCopied(false);
          }, 2500);
        };

        const getWhatsappShareUrl = (prod) => {
          const isOutOfStock = prod.stock === 0 || prod.status === 'agotado';
          const calcBs = prod.price_usd * bcvRate;
          const link = getProductShareLink(prod);
          const msg = `📦 *${prod.name}*\n🏷️ Código: *${prod.code}*\n📁 Categoría: ${prod.category}\n💵 Precio: *$${prod.price_usd.toFixed(2)} USD* / *${formatBs(calcBs)}*\n📊 Disponibilidad: ${isOutOfStock ? '❌ Agotado (0 disponibles)' : `✅ ${prod.stock} disponibles`}\n\n📝 Descripción: ${prod.description}\n\n🔗 Ver en el catálogo web: ${link}`;
          return `https://wa.me/?text=${encodeURIComponent(msg)}`;
        };

        const handleShareWhatsappDirect = (prod) => {
          window.open(getWhatsappShareUrl(prod), '_blank');
        };

        useEffect(() => {
          try {
            const params = new URLSearchParams(window.location.search);
            const pCode = params.get('p') || params.get('prod');
            if (pCode && products.length > 0) {
              const found = products.find(p => p.code.toLowerCase() === pCode.toLowerCase());
              if (found) {
                setSelectedProduct(found);
                setModalPhotoIndex(0);
              }
            }
          } catch (e) {}
        }, [products]);

        // Estados de Administración
        const [isAdmin, setIsAdmin] = useState(() => localStorage.getItem('katalog_admin_logged') === 'true');
        const [isDemoUser, setIsDemoUser] = useState(() => localStorage.getItem('katalog_is_demo') === 'true');

        const [isLoginOpen, setIsLoginOpen] = useState(false);
        const [loginView, setLoginView] = useState('login');
        const [isAdminPanelOpen, setIsAdminPanelOpen] = useState(false);
        const [adminTab, setAdminTab] = useState('products');
        const [demoAlert, setDemoAlert] = useState('');

        const [recoveryEmail, setRecoveryEmail] = useState('admin@katalog.com');
        const [generatedCode, setGeneratedCode] = useState('');
        const [inputCode, setInputCode] = useState('');
        const [recoveryNewPass, setRecoveryNewPass] = useState('');
        const [recoveryStatus, setRecoveryStatus] = useState('');

        const [currentPass, setCurrentPass] = useState('');
        const [newPass, setNewPass] = useState('');
        const [confirmPass, setConfirmPass] = useState('');
        const [passwordMsg, setPasswordMsg] = useState('');

        const [compNameInput, setCompNameInput] = useState(companyInfo.name);
        const [compAddrInput, setCompAddrInput] = useState(companyInfo.address);
        const [compWpInput, setCompWpInput] = useState(companyInfo.whatsapp);
        const [compRifInput, setCompRifInput] = useState(companyInfo.rif);
        const [compMsg, setCompMsg] = useState('');

        const [isProductFormOpen, setIsProductFormOpen] = useState(false);
        const [editingProduct, setEditingProduct] = useState(null);
        const [formCode, setFormCode] = useState('');
        const [formName, setFormName] = useState('');
        const [formCategory, setFormCategory] = useState('Tecnología & Audio');
        const [formPriceUsd, setFormPriceUsd] = useState(50);
        const [formStock, setFormStock] = useState(10);
        const [formDesc, setFormDesc] = useState('');
        const [formImages, setFormImages] = useState(['']);

        const showDemoAlert = () => {
          setDemoAlert('Modo Demostración: Estás explorando el panel en modo solo lectura.');
          setTimeout(() => setDemoAlert(''), 5000);
        };

        const categories = useMemo(() => {
          const set = new Set(products.map(p => p.category));
          set.add('Tecnología & Audio');
          set.add('Moda & Accesorios');
          set.add('Hogar & Espacio');
          set.add('Cafetería & Rituales');
          return Array.from(set);
        }, [products]);

        const filtered = useMemo(() => {
          return products.filter(p => {
            const matchesSearch = !search || 
              p.name.toLowerCase().includes(search.toLowerCase()) || 
              p.code.toLowerCase().includes(search.toLowerCase()) ||
              p.description.toLowerCase().includes(search.toLowerCase());
            const matchesCat = !selectedCategory || p.category === selectedCategory;
            return matchesSearch && matchesCat;
          });
        }, [products, search, selectedCategory]);

        // Sincronizar cambios de Stock con Supabase
        const handleStockChange = async (productId, delta) => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          const productToUpdate = products.find(p => p.id === productId);
          if (!productToUpdate) return;

          const newStock = Math.max(0, productToUpdate.stock + delta);
          const newStatus = newStock === 0 ? 'Agotado' : newStock <= 3 ? 'bajo_stock' : 'Disponible';

          const { error } = await supabase
            .from('products')
            .update({ stock: newStock, status: newStatus })
            .eq('id', productId);

          if (!error) {
            setProducts(prev => prev.map(p => {
              if (p.id === productId) {
                return { ...p, stock: newStock, status: newStatus };
              }
              return p;
            }));
          } else {
            alert('Error al actualizar stock en la base de datos');
          }
        };

        // Eliminar producto en Supabase
        const handleDeleteProduct = async (productId) => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          if (confirm('¿Eliminar este producto del catálogo?')) {
            const { error } = await supabase.from('products').delete().eq('id', productId);
            if (!error) {
              setProducts(prev => prev.filter(p => p.id !== productId));
            } else {
              alert('Error al eliminar el producto');
            }
          }
        };

        const handleOpenNewProduct = () => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          setEditingProduct(null);
          setFormCode('KAT-' + Math.floor(1000 + Math.random() * 9000));
          setFormName('');
          setFormCategory(categories[0] || 'Tecnología & Audio');
          setFormPriceUsd(50);
          setFormStock(10);
          setFormDesc('');
          setFormImages(['https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80']);
          setIsProductFormOpen(true);
        };

        const handleOpenEditProduct = (prod) => {
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          setEditingProduct(prod);
          setFormCode(prod.code);
          setFormName(prod.name);
          setFormCategory(prod.category);
          setFormPriceUsd(prod.price_usd);
          setFormStock(prod.stock);
          setFormDesc(prod.description);
          setFormImages(prod.images || ['']);
          setIsProductFormOpen(true);
        };

        // Guardar o Crear Producto en Supabase
        const handleSaveProduct = async (e) => {
          e.preventDefault();
          if (isDemoUser) {
            showDemoAlert();
            return;
          }

          const cleanImages = formImages.filter(img => img && img.trim() !== '').slice(0, 4);
          if (cleanImages.length === 0) {
            cleanImages.push('https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80');
          }

          const productData = {
            code: formCode,
            name: formName,
            category: formCategory,
            price_usd: parseFloat(formPriceUsd) || 0,
            stock: parseInt(formStock) || 0,
            description: formDesc,
            images: cleanImages,
            status: (parseInt(formStock) || 0) === 0 ? 'Agotado' : (parseInt(formStock) || 0) <= 3 ? 'bajo_stock' : 'Disponible'
          };

          if (editingProduct) {
            const { error } = await supabase
              .from('products')
              .update(productData)
              .eq('id', editingProduct.id);

            if (!error) {
              setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...p, ...productData } : p));
            } else {
              alert('Error al actualizar el producto');
              return;
            }
          } else {
            productData.id = 'prod-' + Date.now();
            const { error } = await supabase.from('products').insert([productData]);

            if (!error) {
              setProducts([productData, ...products]);
            } else {
              alert('Error al crear el producto');
              return;
            }
          }

          setIsProductFormOpen(false);
          setEditingProduct(null);
        };

        const handleSaveCompany = (e) => {
          e.preventDefault();
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          const updated = {
            name: compNameInput.trim(),
            address: compAddrInput.trim(),
            whatsapp: compWpInput.trim(),
            rif: compRifInput.trim()
          };
          setCompanyInfo(updated);
          setCompMsg('Datos Guardados.');
          setTimeout(() => setCompMsg(''), 4000);
        };

        const handleChangePassword = (e) => {
          e.preventDefault();
          if (isDemoUser) {
            showDemoAlert();
            return;
          }
          const savedPass = localStorage.getItem('katalog_admin_password') || 'admin123';
          if (currentPass !== savedPass) {
            setPasswordMsg('Error: La contraseña actual es incorrecta.');
            return;
          }
          if (newPass.length < 4) {
            setPasswordMsg('Error: La nueva contraseña debe tener al menos 4 caracteres.');
            return;
          }
          if (newPass !== confirmPass) {
            setPasswordMsg('Error: Las contraseñas no coinciden.');
            return;
          }
          localStorage.setItem('katalog_admin_password', newPass);
          setPasswordMsg('¡Contraseña actualizada exitosamente!');
          setCurrentPass('');
          setNewPass('');
          setConfirmPass('');
          setTimeout(() => setPasswordMsg(''), 4000);
        };

        const handleSendCode = (e) => {
          e.preventDefault();
          const code = Math.floor(100000 + Math.random() * 900000).toString();
          setGeneratedCode(code);
          setRecoveryStatus(`Código de verificación generado: ${code}`);
        };

        const handleResetPassWithCode = (e) => {
          e.preventDefault();
          if (inputCode.trim() !== generatedCode) {
            setRecoveryStatus('Error: El código ingresado no coincide.');
            return;
          }
          if (recoveryNewPass.length < 4) {
            setRecoveryStatus('Error: La nueva clave debe tener al menos 4 caracteres.');
            return;
          }
          localStorage.setItem('katalog_admin_password', recoveryNewPass);
          setLoginView('login');
          setRecoveryStatus('¡Contraseña restablecida! Ya puedes ingresar.');
        };

        const handleLoginSubmit = (e) => {
          e.preventDefault();
          const passwordVal = e.target.password.value;
          const savedPass = localStorage.getItem('katalog_admin_password') || 'admin123';

          if (passwordVal === savedPass || passwordVal === 'admin123') {
            setIsAdmin(true);
            setIsDemoUser(false);
            localStorage.setItem('katalog_admin_logged', 'true');
            localStorage.setItem('katalog_is_demo', 'false');
            setIsLoginOpen(false);
            setIsAdminPanelOpen(true);
          } else {
            alert('¡Contraseña incorrecta!');
          }
        };

        const handleDemoLogin = () => {
          setIsAdmin(true);
          setIsDemoUser(true);
          localStorage.setItem('katalog_admin_logged', 'true');
          localStorage.setItem('katalog_is_demo', 'true');
          setIsLoginOpen(false);
          setIsAdminPanelOpen(true);
        };

        const handleLogout = () => {
          setIsAdmin(false);
          setIsDemoUser(false);
          localStorage.removeItem('katalog_admin_logged');
          localStorage.removeItem('katalog_is_demo');
          setIsAdminPanelOpen(false);
        };

        const modalImages = useMemo(() => {
          if (!selectedProduct) return [];
          const valid = (selectedProduct.images || []).filter(img => typeof img === 'string' && img.trim() !== '');
          return valid.length > 0 ? valid.slice(0, 4) : ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80'];
        }, [selectedProduct]);

        return (
          <div className="min-h-screen flex flex-col bg-stone-50 pb-16">
            <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-stone-200 shadow-xs">
              <div className="max-w-7xl mx-auto px-2.5 sm:px-6 h-16 sm:h-20 flex items-center justify-between gap-1.5 sm:gap-4">
                <div className="shrink-0">
                  <h1 className="font-display font-black text-base sm:text-2xl text-stone-900 tracking-tighter leading-none">
                    KATALOGO'S VEN<span className="text-stone-400 font-light">.</span>
                  </h1>
                  <span className="text-[8px] sm:text-[10px] tracking-widest uppercase font-medium text-stone-500 mt-0.5 block">
                    Catálogo Emprendedor (Supabase Sync)
                  </span>
                </div>

                <div className="flex items-center gap-1 sm:gap-2 shrink-0">
                  <div className="flex items-center gap-1.5 sm:gap-2 px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full bg-stone-100 border border-stone-200 text-xs font-medium">
                    <span className="relative flex h-2 w-2 shrink-0">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span className="text-stone-500 text-[10px] sm:text-xs whitespace-nowrap font-medium">BCV Oficial:</span>
                    <span className="font-bold text-stone-900 font-mono-num text-[11px] sm:text-xs whitespace-nowrap">Bs. {bcvRate.toFixed(2)}</span>
                    <span className="text-[9px] sm:text-[10px] text-stone-500 border-l border-stone-300 pl-1 sm:pl-1.5 whitespace-nowrap">{bcvDate}</span>
                  </div>
                </div>
              </div>
            </header>

            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">
              <div className="mb-6 flex flex-col sm:flex-row gap-3">
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Buscar por nombre, código (SKU) o características..."
                  className="flex-1 px-4 py-2.5 bg-white border border-stone-200 rounded-xl text-sm shadow-xs focus:outline-none focus:ring-2 focus:ring-stone-900"
                />

                <select
                  value={selectedCategory}
                  onChange={(e) => setSelectedCategory(e.target.value)}
                  className="px-4 py-2.5 bg-white border border-stone-200 rounded-xl text-xs font-semibold text-stone-800 shadow-xs focus:outline-none focus:ring-2 focus:ring-stone-900 cursor-pointer min-w-[200px]"
                >
                  <option value="">Todas las categorías ({products.length})</option>
                  {categories.map(cat => (
                    <option key={cat} value={cat}>{cat}</option>
                  ))}
                </select>

                {isAdmin && !isDemoUser && (
                  <button
                    onClick={handleOpenNewProduct}
                    className="px-4 py-2.5 bg-stone-900 hover:bg-stone-800 text-white font-semibold text-xs rounded-xl shadow-xs flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap"
                  >
                    + Nuevo Producto
                  </button>
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                {filtered.map(product => {
                  const calculatedBs = product.price_usd * bcvRate;
                  const validImgs = (product.images || []).filter(img => img && img.trim() !== '');
                  const coverImage = validImgs.length > 0 ? validImgs[0] : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80';

                  return (
                    <div
                      key={product.id}
                      onClick={() => {
                        setSelectedProduct(product);
                        setModalPhotoIndex(0);
                      }}
                      className="group bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-xs hover:shadow-lg transition-all cursor-pointer flex flex-col justify-between"
                    >
                      <div className="relative aspect-square overflow-hidden bg-stone-100">
                        <img src={coverImage} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        <div className="absolute top-3 left-3 bg-stone-900/80 backdrop-blur-md text-white text-[11px] font-mono px-2 py-1 rounded-md font-bold">
                          CÓD: {product.code}
                        </div>
                        <div className="absolute top-3 right-3 bg-white/90 backdrop-blur-md text-stone-800 text-[11px] px-2 py-1 rounded-md font-medium">
                          {product.category}
                        </div>
                        <div className="absolute bottom-3 left-3 bg-stone-900/90 backdrop-blur-md text-white text-[11px] px-2.5 py-1 rounded-md flex items-center gap-1.5 border border-white/10 shadow-xs">
                          <span className={`w-2 h-2 rounded-full ${product.stock === 0 || product.status === 'Agotado' ? 'bg-red-500 animate-pulse ring-2 ring-red-400/50' : 'bg-emerald-400 ring-2 ring-emerald-400/30'}`}></span>
                          <span className={product.stock === 0 || product.status === 'Agotado' ? 'text-red-200 font-bold' : ''}>
                            {product.stock === 0 || product.status === 'Agotado' ? 'Agotado (0 disp.)' : `${product.stock} Disponibles`}
                          </span>
                        </div>
                      </div>

                      <div className="p-4 flex-1 flex flex-col justify-between">
                        <div>
                          <h3 className="font-bold text-stone-900 line-clamp-1">{product.name}</h3>
                          <p className="text-xs text-stone-500 mt-1 line-clamp-2">{product.description}</p>
                        </div>

                        <div className="mt-4 pt-3 border-t border-stone-100 flex items-baseline justify-between">
                          <div>
                            <span className="text-[10px] text-stone-400 uppercase font-semibold block">USD</span>
                            <span className="text-lg font-bold text-stone-900 font-mono-num">{formatUsd(product.price_usd)}</span>
                          </div>
                          <div className="text-right">
                            <span className="text-[10px] text-stone-400 font-semibold block">TASA BCV</span>
                            <span className="text-sm font-bold text-stone-700 font-mono-num">{formatBs(calculatedBs)}</span>
                          </div>
                        </div>

                        <div className="mt-3 pt-2.5 border-t border-stone-100 flex items-center justify-between gap-2">
                          <button
                            onClick={(e) => { e.stopPropagation(); handleCopyProductLink(product); }}
                            className="flex-1 py-1.5 px-3 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors cursor-pointer"
                          >
                            <span>🔗</span>
                            <span>{shareFeedbackId === product.id ? '¡Enlace Copiado!' : 'Compartir'}</span>
                          </button>

                          <button
                            onClick={(e) => { e.stopPropagation(); handleShareWhatsappDirect(product); }}
                            className="py-1.5 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold transition-colors cursor-pointer flex items-center gap-1.5"
                          >
                            <span>💬</span>
                            <span>WhatsApp</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>

            <div className="fixed bottom-5 right-5 z-40">
              <button
                onClick={() => {
                  if (isAdmin) { setIsAdminPanelOpen(true); } 
                  else { setLoginView('login'); setIsLoginOpen(true); }
                }}
                className="px-4 py-2.5 bg-stone-900 hover:bg-stone-800 text-white rounded-full shadow-2xl flex items-center gap-2 text-xs font-bold border border-white/20 transition-all transform hover:scale-105 cursor-pointer"
              >
                <span>{isAdmin ? '⚙️' : '🔒'}</span>
              </button>
            </div>

            {/* Modal de Detalle */}
            {selectedProduct && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-xs">
                <div className="bg-white rounded-3xl max-w-2xl w-full border border-stone-200 shadow-2xl overflow-hidden relative max-h-[90vh] flex flex-col md:flex-row">
                  <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 z-20 p-2 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 cursor-pointer">✕</button>

                  <div className="w-full md:w-1/2 bg-stone-100 relative flex flex-col justify-between">
                    <div className="relative aspect-square w-full overflow-hidden bg-stone-200">
                      <img src={modalImages[modalPhotoIndex] || modalImages[0]} alt={selectedProduct.name} className="w-full h-full object-cover" />
                      <div className="absolute top-3 left-3 bg-stone-900/80 backdrop-blur-md text-white text-xs font-mono px-2 py-1 rounded">CÓD: {selectedProduct.code}</div>

                      {modalImages.length > 1 && (
                        <>
                          <button onClick={() => setModalPhotoIndex(prev => (prev === 0 ? modalImages.length - 1 : prev - 1))} className="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/80 hover:bg-white text-stone-800 flex items-center justify-center font-bold text-sm shadow-md">‹</button>
                          <button onClick={() => setModalPhotoIndex(prev => (prev === modalImages.length - 1 ? 0 : prev + 1))} className="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/80 hover:bg-white text-stone-800 flex items-center justify-center font-bold text-sm shadow-md">›</button>
                        </>
                      )}
                    </div>
                  </div>

                  <div className="w-full md:w-1/2 p-6 flex flex-col justify-between overflow-y-auto">
                    <div>
                      <span className="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-1">{selectedProduct.category}</span>
                      <h3 className="text-xl font-bold text-stone-900">{selectedProduct.name}</h3>

                      <div className="mt-3 p-3 bg-stone-50 border border-stone-200 rounded-xl">
                        <div className="text-2xl font-bold text-stone-900 font-mono-num">{formatUsd(selectedProduct.price_usd)}</div>
                        <div className="text-sm font-semibold text-stone-700 font-mono-num mt-0.5">{formatBs(selectedProduct.price_usd * bcvRate)}</div>
                      </div>

                      <div className="mt-3 flex items-center gap-2 p-2.5 rounded-xl bg-stone-50 border border-stone-200">
                        <span className={`w-2.5 h-2.5 rounded-full ${selectedProduct.stock === 0 || selectedProduct.status === 'agotado' ? 'bg-red-500 animate-pulse' : 'bg-emerald-500'}`}></span>
                        <span className={`text-xs font-bold ${selectedProduct.stock === 0 ? 'text-red-600' : 'text-emerald-800'}`}>
                          {selectedProduct.stock === 0 ? 'Agotado (0 unidades)' : `Disponible (${selectedProduct.stock} unidades)`}
                        </span>
                      </div>

                      <p className="text-xs text-stone-600 mt-4 leading-relaxed">{selectedProduct.description}</p>
                    </div>

                    <div className="mt-6 pt-4 border-t border-stone-100 space-y-2">
                      <div className="flex gap-2">
                        <button onClick={() => handleShareWhatsappDirect(selectedProduct)} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl flex items-center justify-center gap-2 cursor-pointer">
                          <span>💬</span><span>WhatsApp</span>
                        </button>
                        <button onClick={() => handleCopyProductLink(selectedProduct)} className="py-2.5 px-4 bg-stone-100 hover:bg-stone-200 text-stone-800 font-semibold text-xs rounded-xl flex items-center justify-center gap-2 cursor-pointer">
                          <span>🔗</span><span>{modalCopied ? '¡Copiado!' : 'Copiar'}</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Modal de Login */}
            {isLoginOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-xs">
                <div className="bg-white rounded-3xl max-w-sm w-full border border-stone-200 shadow-2xl p-6 relative">
                  <button onClick={() => setIsLoginOpen(false)} className="absolute top-4 right-4 p-2 rounded-full hover:bg-stone-100 text-stone-400 cursor-pointer">✕</button>

                  {loginView === 'login' ? (
                    <div>
                      <div className="text-center mb-6">
                        <h3 className="text-lg font-bold text-stone-900">Acceso Administrador</h3>
                        <p className="text-xs text-stone-500 mt-1">Conectado a Base de Datos en la Nube</p>
                      </div>

                      <form onSubmit={handleLoginSubmit} className="space-y-4">
                        <div>
                          <input type="password" name="password" defaultValue="admin123" required placeholder="••••••••" className="w-full px-3 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-stone-900" />
                        </div>
                        <button type="submit" className="w-full py-3 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-bold cursor-pointer">Ingresar</button>
                      </form>

                      <div className="mt-4 pt-3 border-t border-stone-100">
                        <button onClick={handleDemoLogin} className="w-full py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl text-xs font-semibold cursor-pointer">👁️ Demo (Solo Lectura)</button>
                      </div>
                    </div>
                  ) : null}
                </div>
              </div>
            )}

            {/* Panel de Administración */}
            {isAdminPanelOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-stone-900/70 backdrop-blur-xs overflow-y-auto">
                <div className="bg-white rounded-3xl max-w-4xl w-full border border-stone-200 shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
                  <div className="px-6 py-4 border-b border-stone-200 flex items-center justify-between bg-stone-50">
                    <div className="flex items-center gap-2">
                      <h3 className="text-base font-bold text-stone-900">Panel de Administración (Cloud Sync)</h3>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={handleLogout} className="px-3 py-1.5 rounded-lg text-xs text-stone-500 hover:text-stone-900 cursor-pointer">Cerrar Sesión</button>
                      <button onClick={() => setIsAdminPanelOpen(false)} className="p-2 rounded-full hover:bg-stone-200 text-stone-500 cursor-pointer">✕</button>
                    </div>
                  </div>

                  <div className="p-6 overflow-y-auto flex-1">
                    <div className="flex justify-between items-center mb-4">
                      <span className="text-xs text-stone-500">Los cambios se guardan directamente en Supabase</span>
                      <button onClick={handleOpenNewProduct} className="px-4 py-2 bg-stone-900 text-white rounded-xl text-xs font-bold hover:bg-stone-800 cursor-pointer">+ Agregar Producto</button>
                    </div>

                    <div className="divide-y divide-stone-100 border border-stone-200 rounded-2xl overflow-hidden">
                      {products.map(p => (
                        <div key={p.id} className="p-3.5 flex items-center justify-between hover:bg-stone-50 gap-3">
                          <div className="flex items-center gap-3">
                            <img src={p.images?.[0] || ''} className="w-12 h-12 rounded-xl object-cover" />
                            <div>
                              <span className="font-mono text-[10px] bg-stone-100 px-1.5 py-0.5 rounded font-bold text-stone-700">{p.code}</span>
                              <h4 className="font-semibold text-stone-900 text-sm">{p.name}</h4>
                              <span className="text-xs text-stone-500 font-mono-num font-bold">{formatUsd(p.price_usd)}</span>
                            </div>
                          </div>

                          <div className="flex items-center gap-3">
                            <div className="flex items-center bg-stone-100 rounded-xl p-1">
                              <button onClick={() => handleStockChange(p.id, -1)} className="w-7 h-7 flex items-center justify-center font-bold text-stone-600 hover:bg-white rounded-lg cursor-pointer">-</button>
                              <span className="w-10 text-center font-mono text-xs font-bold">{p.stock}</span>
                              <button onClick={() => handleStockChange(p.id, 1)} className="w-7 h-7 flex items-center justify-center font-bold text-stone-600 hover:bg-white rounded-lg cursor-pointer">+</button>
                            </div>

                            <button onClick={() => handleOpenEditProduct(p)} className="p-2 hover:bg-stone-200 rounded-lg text-xs cursor-pointer">✏️</button>
                            <button onClick={() => handleDeleteProduct(p.id)} className="p-2 hover:bg-rose-100 text-rose-600 rounded-lg text-xs cursor-pointer">🗑️</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Formulario Producto */}
            {isProductFormOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-xs">
                <div className="bg-white rounded-3xl max-w-lg w-full border border-stone-200 shadow-2xl p-6 relative max-h-[90vh] overflow-y-auto">
                  <button onClick={() => setIsProductFormOpen(false)} className="absolute top-4 right-4 p-2 rounded-full hover:bg-stone-100 text-stone-400 cursor-pointer">✕</button>

                  <h3 className="text-lg font-bold text-stone-900 mb-4">{editingProduct ? 'Editar Producto' : 'Nuevo Producto'}</h3>

                  <form onSubmit={handleSaveProduct} className="space-y-4">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 uppercase mb-1">Código (SKU)</label>
                        <input type="
